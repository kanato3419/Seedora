<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お問い合わせ | Seedora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ====================
         HEADER
    ==================== -->

    <header class="header">

        <a href="index.html" class="logo">
            <img src="./images/seedora-logo.png" alt="Seedora">
        </a>

        <nav class="navigation">

            <a href="index.html">ホーム</a>

            <a href="index.html#about">Seedoraとは</a>

            <a href="index.html#business">Business</a>

            <a href="index.html#news">News</a>

            <a href="contact.html">Contact</a>

        </nav>

        <a href="https://edumarket.jp/" class="edumarket-button">
            EduMarketへ
            <span>→</span>
        </a>

    </header>


    <!-- ====================
         CONTACT
    ==================== -->

    <main>

        <section class="contact-page">

            <div class="contact-heading">

                <p class="section-label">
                    Contact
                </p>

                <h1>
                    Seedoraについて、<br>
                    お気軽にお問い合わせください。
                </h1>

                <p class="contact-lead">
                    サービスについてのご質問やご相談など、<br>
                    お気軽にお問い合わせください。
                </p>

            </div>


            <!-- ====================
                 CONTACT FORM
            ==================== -->

            <form
                class="contact-form"
                action="https://formspree.io/f/mljezjlk"
                method="POST"
            >
<input type="hidden" name="_next" value="thanks.html">
                <div class="form-item">

                    <label for="name">
                        お名前
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="お名前を入力してください"
                        required
                    >

                </div>


                <div class="form-item">

                    <label for="email">
                        メールアドレス
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@example.com"
                        required
                    >

                </div>


                <div class="form-item">

                    <label for="subject">
                        件名
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="お問い合わせの件名"
                    >

                </div>


                <div class="form-item">

                    <label for="message">
                        お問い合わせ内容
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="8"
                        placeholder="お問い合わせ内容をご入力ください"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="contact-submit"
                >
                    送信する
                    <span>→</span>
                </button>

            </form>

        </section>

    </main>


    <!-- ====================
         FOOTER
    ==================== -->

    <footer class="footer">

        <div class="footer-inner">

            <div class="footer-left">

                <a href="index.html" class="footer-logo">

                    <img
                        src="./images/seedora-logo.png"
                        alt="Seedora"
                    >

                </a>

                <p>
                    どんな種にも、きっと花が咲く。
                </p>

            </div>


            <nav class="footer-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#about">
                    About
                </a>

                <a href="index.html#business">
                    Business
                </a>

                <a href="index.html#news">
                    News
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>

        </div>


        <div class="footer-bottom">

            © 2026 Seedora. All Rights Reserved.

        </div>

    </footer>


</body>

</html>
